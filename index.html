<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Clicker - Expanded</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --accent-color: #00f0ff;
            --accent-hover: #00b8cc;
            --gold-color: #ffd700;
            --text-color: #f1f5f9;
            --subtext-color: #94a3b8;
            --disabled-color: #1e293b;

            /* Difficulty Colors */
            --diff-easy: #22c55e;
            --diff-medium: #3b82f6;
            --diff-hard: #a855f7;
            --diff-extreme: #ef4444;
            --diff-insane: #ec4899;
            --diff-wild: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1050px;
        }

        @media (min-width: 850px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Time Display Panel */
        .time-display {
            text-align: center;
            width: 100%;
        }

        .seconds-total {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .time-formatted {
            font-size: 1.05rem;
            color: var(--subtext-color);
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
            text-align: center;
            font-size: 0.85rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.35);
            padding: 8px;
            border-radius: 8px;
        }

        .stat-value {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.95rem;
            margin-top: 3px;
        }

        /* Click Button */
        .click-area {
            position: relative;
            margin: 20px 0;
        }

        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
        }

        .click-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
        }

        /* Floating Animation */
        .floating-text {
            position: absolute;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Panel Headers & Lists */
        .panel-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 12px;
            width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            max-width: 65%;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upgrade-desc {
            font-size: 0.78rem;
            color: var(--subtext-color);
            margin-top: 2px;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-click { background: rgba(0, 240, 255, 0.2); color: var(--accent-color); }
        .badge-passive { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-formula { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

        .upgrade-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .upgrade-btn:hover { background-color: var(--accent-hover); }
        .upgrade-btn:disabled {
            background-color: var(--disabled-color);
            color: #64748b;
            cursor: not-allowed;
        }

        /* Achievements Styling */
        .achievements-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .achievement-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0.45;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .achievement-card.unlocked {
            opacity: 1;
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.03);
        }

        .achievement-icon { font-size: 2rem; }

        .achievement-details {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .achievement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .achievement-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .achievement-card.unlocked .achievement-title { color: var(--gold-color); }
        .achievement-desc { font-size: 0.75rem; color: var(--subtext-color); }

        /* Difficulty Tags */
        .diff-tag {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .diff-easy { background: var(--diff-easy); color: #000; }
        .diff-medium { background: var(--diff-medium); color: #fff; }
        .diff-hard { background: var(--diff-hard); color: #fff; }
        .diff-extreme { background: var(--diff-extreme); color: #fff; }
        .diff-insane { background: var(--diff-insane); color: #fff; }
        .diff-wild { background: var(--diff-wild); color: #000; }

        /* GLITCHED Tier Visual Effects */
        .diff-glitched {
            background: linear-gradient(90deg, #ff0055, #00f0ff, #00ff66);
            background-size: 200% 200%;
            color: #000;
            font-weight: 900;
            animation: glitchGradient 0.8s infinite linear;
        }

        .achievement-card.glitched-unlocked {
            opacity: 1;
            border: 1px solid #00f0ff;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
            animation: cardGlitch 2s infinite alternate;
        }

        @keyframes cardGlitch {
            0% { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
            50% { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
            100% { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }
        }

        @keyframes glitchGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glitch-text {
            text-shadow: 2px 0 #ff0055, -2px 0 #00f0ff;
            animation: glitchAnim 1.2s infinite alternate;
        }

        @keyframes glitchAnim {
            0% { text-shadow: 2px 0 #ff0055, -2px 0 #00f0ff; transform: translate(0); }
            20% { text-shadow: -2px 0 #ff0055, 2px 0 #00f0ff; transform: translate(-1px, 1px); }
            40% { text-shadow: 1px -1px #ff0055, -1px 1px #00f0ff; transform: translate(1px, -1px); }
            60% { text-shadow: -2px 1px #ff0055, 2px -1px #00f0ff; transform: translate(-2px, 0); }
            100% { text-shadow: 2px 0 #ff0055, -2px 0 #00f0ff; transform: translate(0); }
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: #1e293b;
            border: 2px solid var(--gold-color);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease, fadeOut 0.5s ease 3.5s forwards;
        }

        .toast.glitch-toast {
            border-color: #00f0ff;
            background: #090d16;
            animation: slideIn 0.4s ease, glitchToastAnim 0.3s infinite, fadeOut 0.5s ease 3.5s forwards;
        }

        @keyframes glitchToastAnim {
            0% { box-shadow: 0 0 10px #ff0055; }
            50% { box-shadow: 0 0 15px #00f0ff; }
            100% { box-shadow: 0 0 10px #00ff66; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--subtext-color);
            color: var(--subtext-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .control-btn:hover {
            color: var(--text-color);
            border-color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>⏳ TIME CLICKER</h1>
    </header>

    <div class="container">
        <!-- Clicker & Counter Panel -->
        <div class="card time-display">
            <div class="seconds-total" id="seconds-display">0s</div>

            <div class="click-area">

            <div class="stats-grid">
                <div class="stat-box">
                    <div>Per Click</div>
                    <div class="stat-value" id="spc-display">+1s</div>
                </div>
                <div class="stat-box">
                    <div>Per Second</div>
                    <div class="stat-value" id="sps-display">0s/sec</div>
                </div>
                <div class="stat-box">
                    <div>Total Clicks</div>
                    <div class="stat-value" id="clicks-display">0</div>
                </div>
            </div>
        </div>

        <!-- Upgrades Panel -->
        <div class="card">
            <div class="panel-header">
                <span>Upgrades</span>
            </div>
            <div class="upgrade-list" id="upgrade-list">
                <!-- Upgrades generated dynamically -->
            </div>
        </div>

        <!-- Achievements Panel -->
        <div class="card full-width">
            <div class="panel-header">
                <span>🏆 Achievements</span>
                <span id="achievement-count" style="font-size: 0.85rem; color: var(--subtext-color);">0 / 0</span>
            </div>
            <div class="achievements-grid" id="achievements-grid">
                <!-- Achievements generated dynamically -->
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" id="save-btn">Save Game</button>
        <button class="control-btn" id="reset-btn">Hard Reset</button>

    <div id="toast-container"></div>
